<div class="login-page">
  <p-card header="Şifre Sıfırla" styleClass="login-card">
    @if (submitted()) {
      <p-message severity="success" text="Şifreniz güncellendi. Girişe yönlendiriliyorsunuz…" />
    } @else {
      <div class="field">
        <label for="newPassword">Yeni Şifre *</label>
        <p-password
          id="newPassword"
          [(ngModel)]="newPassword"
          [feedback]="true"
          [toggleMask]="true"
          [disabled]="!hasToken"
          (keyup.enter)="submit()"
        />
        @if (formSubmitted && !newPassword) {
          <small class="field-error">Yeni şifre zorunlu (en az 8 karakter, harf ve rakam içermeli).</small>
        }
      </div>
      <div class="field">
        <label for="confirmPassword">Yeni Şifre (Tekrar) *</label>
        <p-password
          id="confirmPassword"
          [(ngModel)]="confirmPassword"
          [feedback]="false"
          [toggleMask]="true"
          [disabled]="!hasToken"
          (keyup.enter)="submit()"
        />
        @if (formSubmitted && newPassword !== confirmPassword) {
          <small class="field-error">Şifreler eşleşmiyor.</small>
        }
      </div>
      @if (error()) {
        <p-message severity="error" [text]="error()!" />
      }
      <p-button label="Şifreyi Güncelle" [loading]="busy()" [disabled]="!hasToken" (onClick)="submit()" />
    }
    <div class="auth-back-link">
      <a routerLink="/login">Girişe dön</a>
    </div>
  </p-card>
</div>
