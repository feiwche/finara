<p-menubar>
  <ng-template #start>
    <span class="app-shell-title">Finara</span>
    <nav class="app-shell-nav">
      <a routerLink="/customers" routerLinkActive="active"><i class="pi pi-users"></i> Müşteriler</a>
      <a routerLink="/campaigns" routerLinkActive="active"><i class="pi pi-megaphone"></i> Kampanyalar</a>
      <a routerLink="/tools" routerLinkActive="active"><i class="pi pi-wrench"></i> Araçlar</a>
    </nav>
  </ng-template>
  <ng-template #end>
    <div class="app-shell-user">
      <a routerLink="/hesabim" routerLinkActive="active"><i class="pi pi-user"></i> {{ authService.email() }}</a>
      <p-button
        [icon]="themeService.isDark() ? 'pi pi-sun' : 'pi pi-moon'"
        severity="secondary"
        text
        [attr.aria-label]="themeService.isDark() ? 'Açık moda geç' : 'Karanlık moda geç'"
        (onClick)="themeService.toggle()"
      />
      <p-button icon="pi pi-sign-out" severity="secondary" text label="Çıkış" (onClick)="logout()" />
    </div>
  </ng-template>
</p-menubar>

<main class="app-shell-content">
  <router-outlet />
</main>
