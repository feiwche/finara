<p-menubar>
  <ng-template #start>
    <span class="app-shell-title">Finara</span>
    <nav class="app-shell-nav">
      <a routerLink="/customers" routerLinkActive="active"><i class="pi pi-users"></i> Müşteriler</a>
      <a routerLink="/campaigns" routerLinkActive="active"><i class="pi pi-megaphone"></i> Kampanyalar</a>
      <a routerLink="/tools" routerLinkActive="active"><i class="pi pi-wrench"></i> Araçlar</a>
    </nav>
  </ng-template>
  <ng-template #end>
    <div class="app-shell-user">
      @if (authService.isDemoAccount()) {
        <p-tag value="Demo Modu" severity="info" />
      }
      <p-button
        [label]="authService.email() ?? ''"
        icon="pi pi-user"
        severity="secondary"
        text
        (onClick)="userMenu.toggle($event)"
      />
      <p-menu #userMenu [model]="userMenuItems" [popup]="true" />
    </div>
  </ng-template>
</p-menubar>

<main class="app-shell-content">
  <router-outlet />
</main>
