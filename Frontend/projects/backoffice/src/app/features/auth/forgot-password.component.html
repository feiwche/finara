<div class="login-page">
  <p-card header="Şifremi Unuttum" styleClass="login-card">
    @if (submitted()) {
      <p-message severity="success" text="Bu e-posta adresine kayıtlı bir hesap varsa, şifre sıfırlama bağlantısı gönderildi." />
    } @else {
      <div class="field">
        <label for="email">E-posta</label>
        <input id="email" type="text" pInputText [(ngModel)]="email" (keyup.enter)="submit()" />
      </div>
      @if (error()) {
        <p-message severity="error" [text]="error()!" />
      }
      <p-button label="Sıfırlama Bağlantısı Gönder" [loading]="busy()" (onClick)="submit()" />
    }
    <div class="auth-back-link">
      <a routerLink="/login">Girişe dön</a>
    </div>
  </p-card>
</div>
