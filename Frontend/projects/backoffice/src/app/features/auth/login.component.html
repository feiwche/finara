<div class="login-page">
  <p-card header="Finara BackOffice — Giriş" styleClass="login-card">
    <div class="field">
      <label for="email">E-posta</label>
      <input id="email" type="text" pInputText [(ngModel)]="email" (keyup.enter)="login()" />
    </div>
    <div class="field">
      <label for="password">Şifre</label>
      <p-password id="password" [(ngModel)]="password" [feedback]="false" [toggleMask]="true" (keyup.enter)="login()" />
    </div>
    @if (error()) {
      <p-message severity="error" [text]="error()!" />
    }
    <p-button label="Giriş yap" [loading]="busy()" (onClick)="login()" />
    <div class="auth-back-link">
      <a routerLink="/forgot-password">Şifremi unuttum</a>
    </div>
  </p-card>
</div>
