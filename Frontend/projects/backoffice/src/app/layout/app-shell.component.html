<p-menubar>
  <ng-template #start>
    <span class="app-shell-title">Finara <p-tag value="BackOffice" severity="contrast" /></span>
    <nav class="app-shell-nav">
      <a routerLink="/dashboard" routerLinkActive="active"><i class="pi pi-chart-bar"></i> Genel Bakış</a>
      <a routerLink="/campaigns" routerLinkActive="active"><i class="pi pi-megaphone"></i> Kampanyalar</a>
      <a routerLink="/audit-logs" routerLinkActive="active"><i class="pi pi-list"></i> Denetim Kaydı</a>
      <a routerLink="/admin-accounts" routerLinkActive="active"><i class="pi pi-users"></i> Yönetici Hesapları</a>
      @if (authService.isSuperAdmin()) {
        <a routerLink="/banks" routerLinkActive="active"><i class="pi pi-building"></i> Banka Yönetimi</a>
      }
      <a routerLink="/cohorts" routerLinkActive="active"><i class="pi pi-sitemap"></i> Kohort Gezgini</a>
      <a routerLink="/notifications" routerLinkActive="active"><i class="pi pi-send"></i> Bildirim Kaydı</a>
    </nav>
  </ng-template>
  <ng-template #end>
    <div class="app-shell-user">
      <span>{{ authService.email() }}</span>
      <p-button
        [icon]="themeService.isDark() ? 'pi pi-sun' : 'pi pi-moon'"
        severity="secondary"
        text
        [attr.aria-label]="themeService.isDark() ? 'Açık moda geç' : 'Karanlık moda geç'"
        (onClick)="themeService.toggle()"
      />
      <p-button icon="pi pi-sign-out" severity="secondary" text label="Çıkış" (onClick)="logout()" />
    </div>
  </ng-template>
</p-menubar>

<main class="app-shell-content">
  <router-outlet />
</main>
