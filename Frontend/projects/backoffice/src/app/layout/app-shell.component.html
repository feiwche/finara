<p-menubar>
  <ng-template #start>
    <span class="app-shell-title">Finara <p-tag value="BackOffice" severity="contrast" /></span>
    <nav class="app-shell-nav">
      <a routerLink="/dashboard" routerLinkActive="active"><i class="pi pi-chart-bar"></i> Genel Bakış</a>
      <a routerLink="/campaigns" routerLinkActive="active"><i class="pi pi-megaphone"></i> Kampanyalar</a>
      <a [class.active]="isManagementActive" (click)="managementMenu.toggle($event)">
        <i class="pi pi-cog"></i> Yönetim <i class="pi pi-chevron-down app-shell-nav-caret"></i>
      </a>
      <p-menu #managementMenu [model]="managementMenuItems" [popup]="true" />
    </nav>
  </ng-template>
  <ng-template #end>
    <div class="app-shell-user">
      <p-button
        [label]="authService.email() ?? ''"
        icon="pi pi-user"
        severity="secondary"
        text
        (onClick)="userMenu.toggle($event)"
      />
      <p-menu #userMenu [model]="userMenuItems" [popup]="true" />
    </div>
  </ng-template>
</p-menubar>

<main class="app-shell-content">
  <router-outlet />
</main>
