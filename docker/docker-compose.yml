services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: finara-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Finara_Dev_2026!"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - finara-mssql-data:/var/opt/mssql

volumes:
  finara-mssql-data: