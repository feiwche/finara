name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/Finara
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release --collect:"XPlat Code Coverage" --settings coverlet.runsettings
      # coverlet.runsettings, EF migration dosyalarını (hiç elle test edilmeyen scaffolding,
      # ~14000 satır) kapsam hesabından hariç tutuyor — aksi halde gerçek servis katmanının
      # kapsamı yapay olarak %8'e kadar düşen yanıltıcı bir rakama gömülüyordu (bulundu).
      - run: dotnet tool install --global dotnet-reportgenerator-globaltool
      - run: |
          ~/.dotnet/tools/reportgenerator \
            -reports:"**/TestResults/**/coverage.cobertura.xml" \
            -targetdir:"coverage-report" \
            -reporttypes:"TextSummary;MarkdownSummaryGithub"
          cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          # 24.x — hem yerel geliştirme ortamıyla (Node 24) hem Dockerfile'ların build
          # aşamasıyla (node:24-slim) aynı npm sürüm ailesinde (11.x) kalmak için. Daha
          # önce 22.x kullanılıyordu ama node:22-slim'in bundled npm'i (10.9.8) burada
          # regenerate edilen package-lock.json'ı `npm ci` ile "Missing: @types/node
          # from lock file" hatasıyla reddediyordu — farklı npm sürümleri aynı lockfile'ı
          # tutarsız çözümleyebiliyor (bkz. Dockerfile'lardaki aynı bulgu).
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      # Kapsam raporlaması Angular'ın ESKİ (deneysel) `:jest` builder'ıyla TEKNİK OLARAK
      # imkânsızdı — jest'i sabit argümanlarla çağırıyor, `--coverage` bayrağı yok ve
      # jest.config dosyasını bilerek yok sayıyordu. Angular 20'nin yeni `@angular/build:unit-test`
      # builder'ı (runner: vitest) codeCoverage'ı destekliyor, bu yüzden üçüne de açıldı
      # (bkz. angular.json). NSwag ile üretilen API istemcisi kapsam dışı — backend'deki
      # EF migration dışlamasıyla aynı "yanıltıcı rakam" gerekçesi.
      # Projeler tek tek çalıştırılıyor (npm test yerine): kapsam çıktısı hepsi için AYNI
      # Frontend/coverage klasörüne yazıldığından, her projenin özeti bir sonraki koşu
      # üzerine yazmadan önce okunmalı.
      - name: Testler + kapsam özeti
        run: |
          echo "## Frontend test kapsamı" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          for project in shared-ui client backoffice; do
            npx ng test "$project"
            echo "### $project" >> "$GITHUB_STEP_SUMMARY"
            node -e "
              const s = require('./coverage/coverage-summary.json').total;
              const rows = ['statements','branches','functions','lines']
                .map(k => \`| \${k} | \${s[k].pct}% (\${s[k].covered}/\${s[k].total}) |\`);
              console.log(['| Metrik | Kapsam |', '|---|---|', ...rows].join('\n'));
            " >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          done
      - run: npm run build

  # E2E: gerçek bir backend + MSSQL'e karşı Playwright çalıştırıyor (demo-login gerçek
  # bir kullanıcı satırına ihtiyaç duyuyor — bkz. playwright.config.ts'teki yorum). MSSQL
  # burada bir "service container" olarak ayağa kaldırılıyor; SA şifresi sadece bu
  # ephemeral CI veritabanı için (gerçek bir sır değil, hiçbir yerde yeniden kullanılmıyor).
  # Migration'lar `dotnet ef database update` ile elle uygulanıyor (backend kendiliğinden
  # migrate ETMİYOR, bkz. Finara.Api/Dockerfile'daki aynı gerekçe) — bu migration'lardan biri
  # (AddDemoAnalystUser) demo hesabını da seed ediyor, testlerin dayandığı hesap bu.
  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Finara_CI_2026!"
          MSSQL_PID: Express
        ports:
          - 1433:1433
    env:
      ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=FinaraDb;User Id=sa;Password=Finara_CI_2026!;TrustServerCertificate=True;"
      Jwt__Key: "ci-only-ephemeral-signing-key-not-a-real-secret-32chars+"
      Notifications__Email__Provider: Mock
      Notifications__Sms__Provider: Mock
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://localhost:5068"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - run: dotnet tool install --global dotnet-ef
      # İki ayrı DbContext var (dotnet ef dbcontext list ile doğrulandı) — ikisinin de
      # migration'ları uygulanmalı, DataProtectionKeysDbContext'inki olmadan 2FA/Data
      # Protection anahtar deposu (DataProtectionKeys tablosu) hiç oluşmaz.
      - name: Migration'ları uygula (MSSQL henüz bağlantı kabul etmiyorsa yeniden dener)
        run: |
          for i in $(seq 1 20); do
            if dotnet ef database update --project Finara.Infrastructure --startup-project Finara.Api --context FinaraDbContext; then
              echo "FinaraDbContext migration'ları uygulandı."; break
            fi
            echo "MSSQL henüz hazır değil, yeniden denenecek... ($i/20)"; sleep 3
            if [ "$i" -eq 20 ]; then echo "MSSQL 60 saniyede hazır olmadı."; exit 1; fi
          done
          dotnet ef database update --project Finara.Api --startup-project Finara.Api --context DataProtectionKeysDbContext
        working-directory: Backend/Finara

      - name: Backend'i arka planda başlat
        run: nohup dotnet run --project Finara.Api --no-launch-profile > /tmp/backend.log 2>&1 &
        working-directory: Backend/Finara
      - name: Backend'in hazır olmasını bekle
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5068/health/ready > /dev/null; then
              echo "Backend hazır."; exit 0
            fi
            sleep 2
          done
          echo "Backend hazır olmadı, loglar:"; cat /tmp/backend.log; exit 1

      - run: npm ci
        working-directory: Frontend
      - run: npx playwright install --with-deps chromium
        working-directory: Frontend
      - run: npx playwright test
        working-directory: Frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: Frontend/playwright-report/
          retention-days: 7

  # CD: backend+frontend+E2E testleri geçince, sadece main/master'a gerçek bir push'ta
  # (PR'larda DEĞİL — her PR için gereksiz imaj yayınlamamak için) üç Docker imajı da
  # build edilip GitHub Container Registry'ye (ghcr.io, ek bir secret gerektirmiyor —
  # otomatik sağlanan GITHUB_TOKEN yeterli) gönderiliyor. Gerçek bir dağıtım hedefi
  # (VakıfBank sandbox vb.) netleşmeden bir sunucuya otomatik deploy adımı EKLENMEDİ —
  # bu iş, hedef netleşince buraya bir adım daha eklenerek tamamlanabilir (bkz.
  # PRODUCTION.md'deki ortam değişkeni listesi, deploy adımının o container'lara
  # sağlaması gereken sırlar).
  docker:
    needs: [backend, frontend, e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: Backend/Finara/Finara.Api/Dockerfile
            context: Backend/Finara
          - name: client
            dockerfile: Frontend/projects/client/Dockerfile
            context: Frontend
          - name: backoffice
            dockerfile: Frontend/projects/backoffice/Dockerfile
            context: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/finara-${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/finara-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
