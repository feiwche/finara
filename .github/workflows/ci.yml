name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/Finara
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release --collect:"XPlat Code Coverage" --settings coverlet.runsettings
      # coverlet.runsettings, EF migration dosyalarını (hiç elle test edilmeyen scaffolding,
      # ~14000 satır) kapsam hesabından hariç tutuyor — aksi halde gerçek servis katmanının
      # kapsamı yapay olarak %8'e kadar düşen yanıltıcı bir rakama gömülüyordu (bulundu).
      - run: dotnet tool install --global dotnet-reportgenerator-globaltool
      - run: |
          ~/.dotnet/tools/reportgenerator \
            -reports:"**/TestResults/**/coverage.cobertura.xml" \
            -targetdir:"coverage-report" \
            -reporttypes:"TextSummary;MarkdownSummaryGithub"
          cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24.x — hem yerel geliştirme ortamıyla (Node 24) hem Dockerfile'ların build
          # aşamasıyla (node:24-slim) aynı npm sürüm ailesinde (11.x) kalmak için. Daha
          # önce 22.x kullanılıyordu ama node:22-slim'in bundled npm'i (10.9.8) burada
          # regenerate edilen package-lock.json'ı `npm ci` ile "Missing: @types/node
          # from lock file" hatasıyla reddediyordu — farklı npm sürümleri aynı lockfile'ı
          # tutarsız çözümleyebiliyor (bkz. Dockerfile'lardaki aynı bulgu).
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # CD: backend+frontend testleri geçince, sadece main/master'a gerçek bir push'ta
  # (PR'larda DEĞİL — her PR için gereksiz imaj yayınlamamak için) üç Docker imajı da
  # build edilip GitHub Container Registry'ye (ghcr.io, ek bir secret gerektirmiyor —
  # otomatik sağlanan GITHUB_TOKEN yeterli) gönderiliyor. Gerçek bir dağıtım hedefi
  # (VakıfBank sandbox vb.) netleşmeden bir sunucuya otomatik deploy adımı EKLENMEDİ —
  # bu iş, hedef netleşince buraya bir adım daha eklenerek tamamlanabilir (bkz.
  # PRODUCTION.md'deki ortam değişkeni listesi, deploy adımının o container'lara
  # sağlaması gereken sırlar).
  docker:
    needs: [backend, frontend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: Backend/Finara/Finara.Api/Dockerfile
            context: Backend/Finara
          - name: client
            dockerfile: Frontend/projects/client/Dockerfile
            context: Frontend
          - name: backoffice
            dockerfile: Frontend/projects/backoffice/Dockerfile
            context: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/finara-${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/finara-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
